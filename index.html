<style>
    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Arial, sans-serif;
    }

    body {
        background: #f5f5f5;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .app {
        width: 100%;
        max-width: 900px;
        height: 100dvh;
        padding: 12px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    /* HEADER (TWO ROWS: TITLE+GENERATE, THEN NAV+CLEAR) */
    .header {
        flex: 0 0 96px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 8px;
        overflow: hidden;
    }

    .header-top {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }

    .header-bottom {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }

    h1 {
        margin: 0;
        font-size: 18px;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /* NAVIGATION BUTTONS */
    .navigation-button {
        width: 45px;
        height: 38px;
        flex-shrink: 0;
        border: none;
        border-radius: 8px;
        background: white;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
        font-size: 22px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.15s;
    }

    .navigation-button:active { transform: scale(0.92); }

    .navigation-button:disabled {
        background: #999;
        color: #555;
        cursor: not-allowed;
        box-shadow: none;
    }

    /* GENERATE BUTTON */
    .generate-button {
        height: 40px;
        flex-shrink: 0;
        border: none;
        border-radius: 8px;
        background: #51cf66;
        color: #fff;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
        font-size: 15px;
        font-weight: bold;
        padding: 0 20px;
        cursor: pointer;
        transition: 0.15s;
        white-space: nowrap;
    }

    .generate-button:active { transform: scale(0.92); }

    .generate-button:disabled {
        background: #999;
        color: #555;
        cursor: not-allowed;
        box-shadow: none;
    }

    /* CLEAR DATA BUTTON */
    .clear-button {
        height: 38px;
        flex-shrink: 0;
        border: none;
        border-radius: 8px;
        background: #ff6b6b;
        color: #fff;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
        font-size: 13px;
        font-weight: bold;
        padding: 0 12px;
        cursor: pointer;
        transition: 0.15s;
        white-space: nowrap;
    }

    .clear-button:active {
        transform: scale(0.92);
    }

    /* CLEAR WORDS BUTTON */
    .clear-words-button {
        height: 38px;
        flex-shrink: 0;
        border: none;
        border-radius: 8px;
        background: #495057;
        color: #fff;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
        font-size: 13px;
        font-weight: bold;
        padding: 0 12px;
        cursor: pointer;
        transition: 0.15s;
        white-space: nowrap;
    }

    .clear-words-button:active {
        transform: scale(0.92);
    }

    /* WORD GRID */
    .country-list {
        flex: 1;
        min-height: 0;
        width: 100%;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(15, 1fr);
        grid-auto-flow: column;
        gap: 6px;
        overflow: hidden;
    }

    /* BUBBLE BUTTON */
    .country-button {
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        border: none;
        border-radius: 8px;
        background: white;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
        font-size: 13px;
        font-weight: bold;
        cursor: pointer;
        padding: 3px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        transition: 0.15s;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        line-height: 1.15;
    }

    .country-button .word-flag {
        font-size: 11px;
        opacity: 0.7;
        font-weight: normal;
    }

    .country-button:active { transform: scale(0.95); }

    /* SINGLE TALL BUTTON - FIRST COLUMN, SPANS THE HEIGHT OF ALL 15 ROWS */
    .country-button.single-slot {
        grid-row: span 15;
        font-size: 16px;
    }

    .country-button.single-slot .word-flag {
        font-size: 13px;
        margin-top: 4px;
    }

    /* EMPTY BUBBLE - NOT YET GENERATED */
    .country-button.empty {
        background: rgba(255, 255, 255, 0.4);
        box-shadow: none;
        border: 1px dashed rgba(0, 0, 0, 0.15);
        cursor: default;
    }

    /*
    =====================================================
    COLOUR STATUS SYSTEM (INDICATOR ONLY - STILL CLICKABLE)
    =====================================================
    */

    /* CLICKED - LESS THAN 4 HOURS */
    .country-button.status-red {
        background: #ff6b6b;
        color: #000;
    }

    /* 4 HOURS TO LESS THAN 28 HOURS */
    .country-button.status-orange {
        background: #ffa94d;
        color: #000;
    }

    /* 28 HOURS TO LESS THAN 52 HOURS */
    .country-button.status-yellow {
        background: #ffe066;
        color: #000;
    }

    /* 52 HOURS TO LESS THAN 76 HOURS */
    .country-button.status-light-yellow {
        background: #fff3bf;
        color: #000;
    }

</style>
</head>

    =====================================================
    SETTINGS
    COLUMN 0 = ONE TALL BUTTON (1 slot, spans all 15 rows)
    COLUMNS 1-8 = 15 SLOTS EACH
    4 COLUMNS VISIBLE AT A TIME
    =====================================================
    */

    const slotsPerColumn = 15;
    const visibleColumns = 4;
    const totalColumns = 9;                                   // 1 single + 8 full columns
    const capacity = 1 + (totalColumns - 1) * slotsPerColumn; // 121 slots total
    const maxColumnOffset = totalColumns - visibleColumns;

    // First slot index for a given column
    function columnStartIndex(col) {
        return col === 0 ? 0 : 1 + (col - 1) * slotsPerColumn;
    }

    let currentColumn = 0;

    const countryList = document.getElementById("countryList");
    const leftButton = document.getElementById("leftButton");
    const rightButton = document.getElementById("rightButton");
    const generateButton = document.getElementById("generateButton");

    /*
    =====================================================
    TIME SETTINGS
    =====================================================
    */

    const ONE_HOUR = 60 * 60 * 1000;

    // Red lasts 4 hours, then every other colour lasts 24 hours
    const RED_END = 4 * ONE_HOUR;                  // 0h  - 4h   red
    const ORANGE_END = RED_END + 24 * ONE_HOUR;    // 4h  - 28h  orange
    const YELLOW_END = ORANGE_END + 24 * ONE_HOUR; // 28h - 52h  yellow
    const LIGHT_YELLOW_END = YELLOW_END + 24 * ONE_HOUR; // 52h - 76h light yellow, then normal

    /*
    =====================================================
    LOCAL STORAGE KEYS
    =====================================================
    */

    const STORAGE_KEY = "wordGenClickedTimes";
    const WORDS_KEY = "wordGenGeneratedWords";
    const LANGS_KEY = "wordGenGeneratedLangs";
    const POSITION_KEY = "wordGenLastColumn";

    function getClickedTimes() {
        const savedData = localStorage.getItem(STORAGE_KEY);
        if (!savedData) return {};
        try {
            return JSON.parse(savedData);
        } catch (error) {
            console.error("Error reading saved click data:", error);
            return {};
        }
    }

    function saveClickedTimes(clickedTimes) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(clickedTimes));
    }

    /*
    =====================================================
    GENERATED WORDS (ONE SLOT PER BUBBLE, NULL = EMPTY)
    Each slot has a matching language code in generatedLangs.
    =====================================================
    */

    function getGeneratedWords() {
        const saved = localStorage.getItem(WORDS_KEY);
        if (!saved) return new Array(capacity).fill(null);
        try {
            const parsed = JSON.parse(saved);
            if (!Array.isArray(parsed)) return new Array(capacity).fill(null);

            const resized = new Array(capacity).fill(null);
            for (let i = 0; i < Math.min(parsed.length, capacity); i++) {
                resized[i] = parsed[i];
            }
            return resized;
        } catch (error) {
            console.error("Error reading saved words:", error);
            return new Array(capacity).fill(null);
        }
    }

    function getGeneratedLangs() {
        const saved = localStorage.getItem(LANGS_KEY);
        if (!saved) return new Array(capacity).fill(null);
        try {
            const parsed = JSON.parse(saved);
            if (!Array.isArray(parsed)) return new Array(capacity).fill(null);

            const resized = new Array(capacity).fill(null);
            for (let i = 0; i < Math.min(parsed.length, capacity); i++) {
                resized[i] = parsed[i];
            }
            return resized;
        } catch (error) {
            console.error("Error reading saved langs:", error);
            return new Array(capacity).fill(null);
        }
    }

    function saveGeneratedWords(words) {
        localStorage.setItem(WORDS_KEY, JSON.stringify(words));
    }

    function saveGeneratedLangs(langs) {
        localStorage.setItem(LANGS_KEY, JSON.stringify(langs));
    }

    let generatedWords = getGeneratedWords();
    let generatedLangs = getGeneratedLangs();

    /*
    =====================================================
    SAVE / LOAD SCROLL POSITION (CURRENT COLUMN)
    =====================================================
    */

    function getSavedColumn() {
        const saved = localStorage.getItem(POSITION_KEY);
        if (saved === null) return 0;

        const parsed = parseInt(saved, 10);
        if (isNaN(parsed)) return 0;

        if (parsed < 0) return 0;
        if (parsed > maxColumnOffset) return maxColumnOffset;
        return parsed;
    }

    function saveColumn(column) {
        localStorage.setItem(POSITION_KEY, String(column));
    }

    currentColumn = getSavedColumn();

    /*
    =====================================================
    GET WORD STATUS (COLOUR ONLY)
    =====================================================
    */

    function getWordStatus(word, clickedTimes) {

        if (!word || !clickedTimes[word]) return "normal";

        const clickedTime = clickedTimes[word];
        const currentTime = Date.now();
        const elapsedTime = currentTime - clickedTime;

        if (elapsedTime >= LIGHT_YELLOW_END) return "normal";
        if (elapsedTime < RED_END) return "red";
        if (elapsedTime < ORANGE_END) return "orange";
        if (elapsedTime < YELLOW_END) return "yellow";
        return "light-yellow";
    }

    /*
    =====================================================
    DISPLAY WORD BUBBLES (FILLED + EMPTY)
    Column 0 is one button spanning all 15 rows; the other
    visible columns are 15 normal buttons each.
    =====================================================
    */

    function showWords() {

        countryList.innerHTML = "";

        const clickedTimes = getClickedTimes();

        // Build the list of slot indexes for the visible columns
        const cells = [];

        for (let col = currentColumn; col < currentColumn + visibleColumns; col++) {
            if (col >= totalColumns) break;

            if (col === 0) {
                cells.push({ index: 0, single: true });
            } else {
                const start = columnStartIndex(col);
                for (let s = 0; s < slotsPerColumn; s++) {
                    cells.push({ index: start + s, single: false });
                }
            }
        }

        cells.forEach(cell => {

            const word = generatedWords[cell.index];
            const lang = generatedLangs[cell.index];
            const button = document.createElement("button");
            button.className = "country-button";

            if (cell.single) {
                button.classList.add("single-slot");
            }

            if (word) {
                const wordSpan = document.createElement("span");
                wordSpan.innerText = word;
                button.appendChild(wordSpan);

                if (lang && wordBank[lang]) {
                    const flagSpan = document.createElement("span");
                    flagSpan.className = "word-flag";
                    flagSpan.innerText = wordBank[lang].flag;
                    button.appendChild(flagSpan);
                }

                button.dataset.word = word;

                const status = getWordStatus(word, clickedTimes);
                applyWordStatus(button, status);

                button.onclick = function() {
                    copyWord(button, word, wordSpan);
                };
            } else {
                button.classList.add("empty");
                button.disabled = true;
            }

            countryList.appendChild(button);
        });

        updateNavigationButtons();
        updateGenerateButton();
    }

    /*
    =====================================================
    APPLY WORD STATUS (COLOUR ONLY - NEVER DISABLES A FILLED BUBBLE)
    =====================================================
    */

    function applyWordStatus(button, status) {

        button.classList.remove(
            "status-red",
            "status-orange",
            "status-yellow",
            "status-light-yellow"
        );

        if (status === "red") {
            button.classList.add("status-red");
        } else if (status === "orange") {
            button.classList.add("status-orange");
        } else if (status === "yellow") {
            button.classList.add("status-yellow");
        } else if (status === "light-yellow") {
            button.classList.add("status-light-yellow");
        }

        button.disabled = false;
    }

    /*
    =====================================================
    GENERATE WORD
    - Picks a random language (English, Spanish, or Chinese)
      each time, then a random word from that language's list.
    - New word always lands in the single tall button.
    - The word that was there drops into the top of column 2,
      and everything else shifts down one slot (down the column,
      then into the next column). Whatever falls off the end of
      the last slot is dropped.
    - Never repeats a word already sitting in a bubble.
    =====================================================
    */

    function generateWord() {

        const usedWords = new Set(generatedWords.filter(w => w !== null));

        let newWord = null;
        let newLang = null;
        let attempts = 0;

        do {
            const lang = randomFrom(allLanguages);
            const candidate = randomFrom(wordBank[lang].words);
            attempts++;

            if (!usedWords.has(candidate) && !containsBannedSubstring(candidate)) {
                newWord = candidate;
                newLang = lang;
                break;
            }
        } while (attempts < 50);

        if (!newWord) {
            window.alert("Couldn't come up with a suitable word - try again.");
            return;
        }

        generatedWords.unshift(newWord);
        generatedWords.pop();
        generatedLangs.unshift(newLang);
        generatedLangs.pop();

        saveGeneratedWords(generatedWords);
        saveGeneratedLangs(generatedLangs);

        // Jump the view back to the first page so the new word is visible
        currentColumn = 0;
        saveColumn(currentColumn);

        showWords();
    }

    /*
    =====================================================
    MOVE LEFT / RIGHT
    =====================================================
    */

    function moveLeft() {
        if (currentColumn > 0) {
            currentColumn--;
            saveColumn(currentColumn);
            showWords();
        }
    }

    function moveRight() {
        if (currentColumn < maxColumnOffset) {
            currentColumn++;
            saveColumn(currentColumn);
            showWords();
        }
    }

    /*
    =====================================================
    UPDATE NAVIGATION / GENERATE BUTTON STATE
    =====================================================
    */

    function updateNavigationButtons() {
        leftButton.disabled = currentColumn === 0;
        rightButton.disabled = currentColumn >= maxColumnOffset;
    }

    function updateGenerateButton() {
        // Always enabled - new words always shift into the first
        // bubble, so there's no "full" state to block on.
        generateButton.disabled = false;
    }

    /*
    =====================================================
    COPY WORD
    =====================================================
    */

    function copyTextFallback(text) {
        try {
            const textarea = document.createElement("textarea");
            textarea.value = text;
            textarea.style.position = "fixed";
            textarea.style.top = "0";
            textarea.style.left = "0";
            textarea.style.opacity = "0";
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            const success = document.execCommand("copy");
            document.body.removeChild(textarea);
            return success;
        } catch (error) {
            console.error("Fallback copy failed:", error);
            return false;
        }
    }

    function copyWord(button, word, wordSpan) {

        const clickedTimes = getClickedTimes();
        clickedTimes[word] = Date.now();
        saveClickedTimes(clickedTimes);

        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(word).catch(() => {
                copyTextFallback(word);
            });
        } else {
            copyTextFallback(word);
        }

        const originalText = wordSpan.innerText;
        wordSpan.innerText = "Copied!";
        button.classList.remove(
            "status-orange",
            "status-yellow",
            "status-light-yellow"
        );
        button.classList.add("status-red");

        setTimeout(function() {
            wordSpan.innerText = originalText;
        }, 1000);
    }

    /*
    =====================================================
    CLEAR DATA
    RESETS COLOUR GRADING ONLY - WORDS STAY IN PLACE
    =====================================================
    */

    function clearData() {

        const confirmed = window.confirm(
            "Clear colour data? This will reset every bubble's colour back to normal (words stay put)."
        );

        if (!confirmed) {
            return;
        }

        localStorage.removeItem(STORAGE_KEY);

        showWords();
    }

    /*
    =====================================================
    CLEAR WORDS
    EMPTIES ALL 121 BUBBLES (WORDS ONLY - COLOURS UNTOUCHED)
    =====================================================
    */

    function clearWords() {

        const confirmed = window.confirm(
            "Clear all generated words? This will empty every bubble."
        );

        if (!confirmed) {
            return;
        }

        localStorage.removeItem(WORDS_KEY);
        localStorage.removeItem(LANGS_KEY);
        generatedWords = new Array(capacity).fill(null);
        generatedLangs = new Array(capacity).fill(null);

        showWords();
    }

    /*
    =====================================================
    AUTOMATICALLY UPDATE COLOURS
    =====================================================
    */

    function updateAllWordStatuses() {

        const clickedTimes = getClickedTimes();
        const buttons = document.querySelectorAll(".country-button:not(.empty)");

        buttons.forEach(button => {
            const word = button.dataset.word;
            if (!word) return;
            const wordSpan = button.querySelector("span:not(.word-flag)");
            if (wordSpan && wordSpan.innerText === "Copied!") return;

            const status = getWordStatus(word, clickedTimes);
            applyWordStatus(button, status);
        });
    }

    /*
    =====================================================
    START
    =====================================================
    */

    showWords();

    setInterval(updateAllWordStatuses, 60 * 1000);

</script>
</body>
</html>
