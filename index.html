<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word + Question Generator</title>
<style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: Arial, sans-serif; background: #f5f5f5; }
    .app { max-width: 900px; height: 100dvh; margin: 0 auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
    .section { background: #fff; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,.12); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .section.words { flex: 0 0 auto; }
    .section.questions { flex: 1; min-height: 0; }
    h2 { margin: 0; font-size: 14px; color: #495057; text-transform: uppercase; letter-spacing: .5px; }
    .row { display: flex; align-items: center; gap: 10px; }
    button { font-family: inherit; border: none; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; transition: .15s; box-shadow: 0 2px 5px rgba(0,0,0,.15); }
    button:active { transform: scale(.95); }
    .green { background: #51cf66; height: 40px; padding: 0 20px; font-size: 15px; }
    .blue { background: #339af0; height: 40px; padding: 0 16px; font-size: 14px; }
    .word-display { flex: 1; min-height: 40px; display: flex; align-items: center; font-size: 26px; font-weight: bold; color: #212529; overflow-wrap: anywhere; }
    .word-display.empty { color: #adb5bd; font-size: 16px; font-weight: normal; }
    .q-list { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(3, 1fr); grid-auto-flow: column; gap: 8px; }
    .q-btn { background: #fff; color: #000; border: 1px solid #dee2e6; min-height: 0; padding: 8px 10px; font-size: 14px; text-align: left; display: flex; flex-direction: column; justify-content: center; gap: 2px; box-shadow: 0 2px 5px rgba(0,0,0,.1); }
    .q-btn .tag { font-size: 11px; font-weight: bold; color: #339af0; }
    .q-btn .txt { font-weight: normal; line-height: 1.25; overflow: hidden; }
    .q-btn.done { background: #ff6b6b; border-color: #ff6b6b; }
    .q-btn.done .tag { color: #000; }
    .q-btn:disabled { background: rgba(255,255,255,.5); border: 1px dashed rgba(0,0,0,.15); box-shadow: none; cursor: default; }
    @media (max-width: 560px) {
        .q-list { grid-template-columns: 1fr; grid-template-rows: repeat(6, 1fr); grid-auto-flow: row; }
        .word-display { font-size: 22px; }
    }
</style>
</head>
<body>
<div class="app">

    <!-- SECTION 1: WORD -->
    <div class="section words">
        <h2>1. Word</h2>
        <div class="row">
            <div id="wordDisplay" class="word-display empty">Press Generate Word</div>
            <button class="green" onclick="generateWord()">Generate Word</button>
        </div>
    </div>

    <!-- SECTION 2: QUESTIONS (5W + 1H based on the word) -->
    <div class="section questions">
        <div class="row" style="justify-content: space-between;">
            <h2>2. Questions (5W1H)</h2>
            <button class="blue" onclick="generateQuestions()">New Questions</button>
        </div>
        <div id="qList" class="q-list"></div>
    </div>

</div>

<script>
    /* No storage, no history: everything resets when the page reloads. */

    // SECTION 1 - words (everyday things that work with all 6 question types)
    const WORDS = [
        "phone battery","wifi router","laptop","umbrella","bicycle","melatonin","tomato plant","cover letter",
        "resume","passport","visa","vitamin D","coffee","green tea","air fryer","rice cooker","electric fan",
        "air conditioner","power bank","earphones","sunscreen","yoga","meditation","credit card","insurance",
        "savings account","password manager","two step verification","external hard drive","SSD","keyboard",
        "backpack","running shoes","sleeping bag","tent","dog vaccine","cat food","houseplant","compost",
        "solar panel","electric car","scooter","drone","smartwatch","e-book reader","microwave","blender",
        "mattress","pillow","protein powder","stretching","vinegar","baking soda","olive oil","sourdough bread"
    ];

    // SECTION 2 - question templates, several variants per W so they don't repeat
    const TEMPLATES = {
        What:  ["what is {w}", "what does {w} do", "what is {w} used for", "what is the best {w}"],
        Why:   ["why is {w} important", "why do people use {w}", "why is {w} so expensive", "why is my {w} not working"],
        Who:   ["who invented {w}", "who needs {w}", "who sells {w}", "who should not use {w}"],
        When:  ["when was {w} invented", "when should i use {w}", "when to replace {w}", "when is the best time to buy {w}"],
        Where: ["where to buy {w}", "where did {w} come from", "where can i learn about {w}", "where to get {w} cheap"],
        How:   ["how to use {w}", "how does {w} work", "how much does {w} cost", "how to choose {w}"]
    };
    const ORDER = ["What", "Why", "Who", "When", "Where", "How"];

    let currentWord = null;

    function randomFrom(list) { return list[Math.floor(Math.random() * list.length)]; }
    function randInt(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }

    /* HUMAN ERRORS - typos, missing letters/words, cut-off, wrong caps */
    const keyNeighbours = {
        a:"sq",b:"vn",c:"xv",d:"sf",e:"wr",f:"dg",g:"fh",h:"gj",i:"uo",j:"hk",k:"jl",l:"k",m:"n",
        n:"bm",o:"ip",p:"o",q:"w",r:"et",s:"ad",t:"ry",u:"yi",v:"cb",w:"qe",x:"zc",y:"tu",z:"x"
    };
    function pickWordIndex(words, minLen) {
        const ok = words.map((w, i) => w.length >= minLen ? i : -1).filter(i => i >= 0);
        return ok.length ? randomFrom(ok) : -1;
    }
    const mistakes = {
        dropWord(t) {
            const w = t.split(" ");
            if (w.length < 4) return null;
            w.splice(randInt(1, w.length - 1), 1);
            return w.join(" ");
        },
        dropLetter(t) {
            const w = t.split(" "), i = pickWordIndex(w, 4);
            if (i < 0) return null;
            const p = randInt(1, w[i].length - 1);
            w[i] = w[i].slice(0, p) + w[i].slice(p + 1);
            return w.join(" ");
        },
        swapLetters(t) {
            const w = t.split(" "), i = pickWordIndex(w, 4);
            if (i < 0) return null;
            const p = randInt(0, w[i].length - 2), c = w[i].split("");
            [c[p], c[p + 1]] = [c[p + 1], c[p]];
            w[i] = c.join("");
            return w.join(" ");
        },
        doubleLetter(t) {
            const w = t.split(" "), i = pickWordIndex(w, 3);
            if (i < 0) return null;
            const p = randInt(0, w[i].length - 1);
            w[i] = w[i].slice(0, p) + w[i][p] + w[i].slice(p);
            return w.join(" ");
        },
        wrongKey(t) {
            const w = t.split(" "), i = pickWordIndex(w, 3);
            if (i < 0) return null;
            const p = randInt(0, w[i].length - 1), ch = w[i][p].toLowerCase();
            if (!keyNeighbours[ch]) return null;
            w[i] = w[i].slice(0, p) + randomFrom(keyNeighbours[ch].split("")) + w[i].slice(p + 1);
            return w.join(" ");
        },
        cutOff(t) {
            if (t.length < 14) return null;
            return t.slice(0, randInt(Math.ceil(t.length * 0.65), t.length - 3)).trimEnd();
        },
        cutWords(t) {
            const w = t.split(" ");
            if (w.length < 4) return null;
            return w.slice(0, randInt(Math.ceil(w.length * 0.65), w.length - 1)).join(" ");
        }
    };

    function humanize(text) {
        // missing caps: most people type everything lowercase, even names like SSD
        let result = Math.random() < 0.8 ? text.toLowerCase() : text;
        const passes = Math.random() < 0.35 ? 2 : 1;
        // a cut-off phrase already looks incomplete, so never stack it with a second mistake
        const names = Object.keys(mistakes).filter(n => passes === 1 || !/^cut/.test(n));
        const used = new Set();
        for (let n = 0; n < passes; n++) {
            for (let tries = 0; tries < 8; tries++) {
                const name = randomFrom(names);
                if (used.has(name)) continue;
                const out = mistakes[name](result);
                if (out && out !== result) { result = out; used.add(name); break; }
            }
        }
        const cut = used.has("cutOff") || used.has("cutWords");
        if (!cut && Math.random() < 0.3) result += "?";               // inconsistent question marks
        if (Math.random() < 0.2) result = result.charAt(0).toUpperCase() + result.slice(1); // sometimes capital first letter
        return result;
    }

    function generateWord() {
        let w;
        do { w = randomFrom(WORDS); } while (w === currentWord && WORDS.length > 1);
        currentWord = w;
        const d = document.getElementById("wordDisplay");
        d.textContent = w;
        d.classList.remove("empty");
        generateQuestions();
    }

    function generateQuestions() {
        const list = document.getElementById("qList");
        list.innerHTML = "";
        ORDER.forEach(type => {
            const b = document.createElement("button");
            b.className = "q-btn";
            if (!currentWord) {
                b.disabled = true;
                b.innerHTML = '<span class="tag">' + type + '</span><span class="txt">-</span>';
                list.appendChild(b);
                return;
            }
            const q = humanize(randomFrom(TEMPLATES[type]).replace("{w}", currentWord));
            b.innerHTML = '<span class="tag">' + type + '</span>';
            const t = document.createElement("span");
            t.className = "txt";
            t.textContent = q;
            b.appendChild(t);
            b.onclick = () => searchQuestion(b, q, t);
            list.appendChild(b);
        });
    }

    // click a question: copy it + open a new tab searching it
    function copyFallback(text) {
        try {
            const ta = document.createElement("textarea");
            ta.value = text;
            ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
            document.body.appendChild(ta);
            ta.focus(); ta.select();
            document.execCommand("copy");
            document.body.removeChild(ta);
        } catch (e) {}
    }

    function searchQuestion(button, q, span) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(q).catch(() => copyFallback(q));
        } else {
            copyFallback(q);
        }
        window.open("https://www.google.com/search?q=" + encodeURIComponent(q), "_blank", "noopener,noreferrer");
        button.classList.add("done");
        span.textContent = "Searching!";
        setTimeout(() => { span.textContent = q; }, 1000);
    }

    generateQuestions(); // empty placeholders at start
</script>
</body>
</html>
