<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Generator</title>
<style>
    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Arial, sans-serif;
    }

    body {
        background: #f5f5f5;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .app {
        width: 100%;
        max-width: 900px;
        height: 100dvh;
        padding: 12px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    /* HEADER (TWO ROWS: TITLE+GENERATE, THEN NAV+CLEAR) */
    .header {
        flex: 0 0 96px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 8px;
        overflow: hidden;
    }

    .header-top {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }

    .header-bottom {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }

    h1 {
        margin: 0;
        font-size: 18px;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /* NAVIGATION BUTTONS */
    .navigation-button {
        width: 45px;
        height: 38px;
        flex-shrink: 0;
        border: none;
        border-radius: 8px;
        background: white;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
        font-size: 22px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.15s;
    }

    .navigation-button:active { transform: scale(0.92); }

    .navigation-button:disabled {
        background: #999;
        color: #555;
        cursor: not-allowed;
        box-shadow: none;
    }

    /* GENERATE BUTTON */
    .generate-button {
        height: 40px;
        flex-shrink: 0;
        border: none;
        border-radius: 8px;
        background: #51cf66;
        color: #fff;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
        font-size: 15px;
        font-weight: bold;
        padding: 0 20px;
        cursor: pointer;
        transition: 0.15s;
        white-space: nowrap;
    }

    .generate-button:active { transform: scale(0.92); }

    .generate-button:disabled {
        background: #999;
        color: #555;
        cursor: not-allowed;
        box-shadow: none;
    }

    /* CLEAR DATA BUTTON */
    .clear-button {
        height: 38px;
        flex-shrink: 0;
        border: none;
        border-radius: 8px;
        background: #ff6b6b;
        color: #fff;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
        font-size: 13px;
        font-weight: bold;
        padding: 0 12px;
        cursor: pointer;
        transition: 0.15s;
        white-space: nowrap;
    }

    .clear-button:active {
        transform: scale(0.92);
    }

    /* CLEAR WORDS BUTTON */
    .clear-words-button {
        height: 38px;
        flex-shrink: 0;
        border: none;
        border-radius: 8px;
        background: #495057;
        color: #fff;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
        font-size: 13px;
        font-weight: bold;
        padding: 0 12px;
        cursor: pointer;
        transition: 0.15s;
        white-space: nowrap;
    }

    .clear-words-button:active {
        transform: scale(0.92);
    }

    /* WORD GRID */
    .country-list {
        flex: 1;
        min-height: 0;
        width: 100%;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(15, 1fr);
        grid-auto-flow: column;
        gap: 6px;
        overflow: hidden;
    }

    /* BUBBLE BUTTON */
    .country-button {
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        border: none;
        border-radius: 8px;
        background: white;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
        font-size: 13px;
        font-weight: bold;
        cursor: pointer;
        padding: 3px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        transition: 0.15s;
    }

    .country-button:active { transform: scale(0.95); }

    /* EMPTY BUBBLE - NOT YET GENERATED */
    .country-button.empty {
        background: rgba(255, 255, 255, 0.4);
        box-shadow: none;
        border: 1px dashed rgba(0, 0, 0, 0.15);
        cursor: default;
    }

    /*
    =====================================================
    COLOUR STATUS SYSTEM (INDICATOR ONLY - STILL CLICKABLE)
    =====================================================
    */

    /* CLICKED - LESS THAN 24 HOURS */
    .country-button.status-red {
        background: #ff6b6b;
        color: #000;
    }

    /* 24 HOURS TO LESS THAN 48 HOURS */
    .country-button.status-orange {
        background: #ffa94d;
        color: #000;
    }

    /* 48 HOURS TO LESS THAN 72 HOURS */
    .country-button.status-yellow {
        background: #ffe066;
        color: #000;
    }

    /* 72 HOURS TO LESS THAN 96 HOURS */
    .country-button.status-light-yellow {
        background: #fff3bf;
        color: #000;
    }

</style>
</head>
<body>

<div class="app">

    <!-- HEADER -->
    <div class="header">
        <div class="header-top">
            <h1>Word Generator</h1>
            <button id="generateButton" class="generate-button" onclick="generateWord()">Generate</button>
        </div>
        <div class="header-bottom">
            <button id="leftButton" class="navigation-button" onclick="moveLeft()">←</button>
            <button id="rightButton" class="navigation-button" onclick="moveRight()">→</button>
            <button id="clearButton" class="clear-button" onclick="clearData()">Clear Colours</button>
            <button id="clearWordsButton" class="clear-words-button" onclick="clearWords()">Clear Words</button>
        </div>
    </div>

    <!-- WORD GRID -->
    <div id="countryList" class="country-list"></div>

</div>

<script>

    /*
    =====================================================
    ENGLISH WORD DICTIONARY
    A built-in list of real English words the generator
    picks from at random. Duplicate checking happens
    against whatever is already sitting in the bubbles.
    =====================================================
    */

    const englishWords = [
        "Apple","Banana","Orange","Grape","Lemon","Peach","Mango","Cherry","Melon","Berry",
        "River","Mountain","Ocean","Forest","Desert","Island","Valley","Meadow","Canyon","Glacier",
        "Sunset","Sunrise","Cloud","Storm","Breeze","Thunder","Rainbow","Shadow","Horizon","Twilight",
        "Tiger","Eagle","Dolphin","Panther","Falcon","Otter","Wolf","Fox","Rabbit","Owl",
        "Guitar","Piano","Violin","Drum","Trumpet","Flute","Harp","Cello","Banjo","Clarinet",
        "Castle","Bridge","Tower","Garden","Harbor","Village","Cottage","Palace","Fountain","Lighthouse",
        "Whisper","Echo","Flame","Spark","Frost","Mist","Dew","Ember","Blaze","Ripple",
        "Journey","Voyage","Quest","Adventure","Expedition","Pilgrimage","Odyssey","Excursion","Trek","Wander",
        "Wisdom","Courage","Honor","Justice","Freedom","Harmony","Serenity","Triumph","Destiny","Legacy",
        "Crystal","Diamond","Emerald","Sapphire","Amber","Pearl","Opal","Jade","Ruby","Topaz",
        "Comet","Meteor","Nebula","Galaxy","Cosmos","Orbit","Eclipse","Aurora","Zenith","Satellite",
        "Whistle","Melody","Rhythm","Chorus","Ballad","Serenade","Anthem","Sonata","Symphony","Lullaby",
        "Brave","Gentle","Swift","Quiet","Bright","Bold","Calm","Clever","Fierce","Graceful",
        "Golden","Silver","Crimson","Azure","Ivory","Scarlet","Violet","Copper","Bronze","Turquoise",
        "Dream","Hope","Wonder","Magic","Mystery","Fantasy","Legend","Myth","Fable","Story",
        "Ancient","Modern","Timeless","Eternal","Infinite","Endless","Boundless","Vast","Immense","Grand",
        "Whale","Shark","Turtle","Seal","Penguin","Walrus","Octopus","Starfish","Coral","Anchor",
        "Lantern","Candle","Torch","Beacon","Glow","Shine","Gleam","Flicker","Radiance","Luster",
        "Path","Trail","Road","Route","Passage","Crossing","Junction","Gateway","Threshold","Corridor",
        "Feather","Petal","Blossom","Bloom","Leaf","Branch","Root","Seed","Sprout","Vine",
        "Whisker","Paw","Claw","Wing","Fin","Tail","Mane","Horn","Antler","Hoof",
        "Puzzle","Riddle","Enigma","Secret","Clue","Cipher","Code","Key","Lock","Vault",
        "Marble","Granite","Quartz","Slate","Clay","Sand","Stone","Pebble","Boulder","Cliff",
        "Autumn","Winter","Spring","Summer","Harvest","Bloom","Thaw","Solstice","Equinox","Season",
        "Sparrow","Robin","Heron","Crane","Swan","Peacock","Raven","Dove","Finch","Sparrowhawk",
        "Charm","Grace","Elegance","Beauty","Splendor","Glory","Majesty","Brilliance","Wonder","Poise",
        "Compass","Map","Sail","Mast","Deck","Hull","Rudder","Helm","Anchorage","Voyager",
        "Prairie","Savanna","Tundra","Marsh","Swamp","Lagoon","Reef","Cove","Bay","Delta",
        "Quiver","Shield","Sword","Armor","Helmet","Banner","Crest","Emblem","Insignia","Blade",
        "Phoenix","Griffin","Dragon","Unicorn","Pegasus","Centaur","Mermaid","Sphinx","Titan","Oracle",
        "Chime","Bell","Gong","Drumbeat","Cadence","Tempo","Pulse","Beat","Groove","Harmony",
        "Shimmer","Glimmer","Flash","Sparkle","Twinkle","Glow","Radiant","Luminous","Vivid","Dazzle",
        "Migration","Pilgrimage","Wandering","Roaming","Exploring","Venturing","Discovery","Frontier","Horizon","Journeyman",
        "Silence","Stillness","Calm","Peace","Quietude","Tranquility","Serenity","Repose","Rest","Solitude",
        "Lightning","Tempest","Cyclone","Hurricane","Tornado","Blizzard","Monsoon","Gale","Squall","Downpour",
        "Velvet","Silk","Satin","Linen","Wool","Cotton","Cashmere","Suede","Leather","Denim",
        "Whistle","Trumpet","Anthem","Fanfare","Overture","Prelude","Refrain","Verse","Chorus","Interlude",
        "Meadowlark","Kingfisher","Hummingbird","Woodpecker","Nightingale","Cardinal","Mockingbird","Bluebird","Blackbird","Starling",
        "Cinnamon","Vanilla","Nutmeg","Saffron","Ginger","Clove","Basil","Mint","Sage","Thyme",
        "Marble","Ivory","Alabaster","Obsidian","Amethyst","Citrine","Garnet","Onyx","Moonstone","Peridot",
        "Willow","Maple","Cedar","Birch","Oak","Pine","Elm","Aspen","Redwood","Sycamore"
    ];

    function randomFrom(list) {
        return list[Math.floor(Math.random() * list.length)];
    }

    /*
    =====================================================
    CONTENT FILTER
    Screens out generated words that happen to contain a
    common vulgar/adult substring, so nothing embarrassing
    or filter-triggering slips through by chance.
    =====================================================
    */

    const bannedSubstrings = [
        "sex","porn","fuck","fuk","fck","shit","cunt","cock","dick","penis",
        "vagina","boob","tit","nude","naked","rape","slut","whore","bitch",
        "biatch","hoe","xxx","anal","orgasm","cum","jizz","clit","smut",
        "erotic","fetish","incest","milf","nsfw"
    ];

    function containsBannedSubstring(word) {
        const lower = word.toLowerCase();
        return bannedSubstrings.some(sub => lower.includes(sub));
    }

    /*
    =====================================================
    SETTINGS
    8 COLUMNS MAX, 15 SLOTS PER COLUMN, 4 COLUMNS VISIBLE
    =====================================================
    */

    const slotsPerColumn = 15;
    const visibleColumns = 4;
    const totalColumns = 8;
    const capacity = totalColumns * slotsPerColumn; // 120 slots total
    const maxColumnOffset = totalColumns - visibleColumns;

    let currentColumn = 0;

    const countryList = document.getElementById("countryList");
    const leftButton = document.getElementById("leftButton");
    const rightButton = document.getElementById("rightButton");
    const generateButton = document.getElementById("generateButton");

    /*
    =====================================================
    TIME SETTINGS
    =====================================================
    */

    const ONE_HOUR = 60 * 60 * 1000;
    const TWENTY_FOUR_HOURS = 24 * ONE_HOUR;
    const FORTY_EIGHT_HOURS = 48 * ONE_HOUR;
    const SEVENTY_TWO_HOURS = 72 * ONE_HOUR;
    const NINETY_SIX_HOURS = 96 * ONE_HOUR;

    /*
    =====================================================
    LOCAL STORAGE KEYS
    =====================================================
    */

    const STORAGE_KEY = "wordGenClickedTimes";
    const WORDS_KEY = "wordGenGeneratedWords";
    const POSITION_KEY = "wordGenLastColumn";

    function getClickedTimes() {
        const savedData = localStorage.getItem(STORAGE_KEY);
        if (!savedData) return {};
        try {
            return JSON.parse(savedData);
        } catch (error) {
            console.error("Error reading saved click data:", error);
            return {};
        }
    }

    function saveClickedTimes(clickedTimes) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(clickedTimes));
    }

    /*
    =====================================================
    GENERATED WORDS (ONE SLOT PER BUBBLE, NULL = EMPTY)
    =====================================================
    */

    function getGeneratedWords() {
        const saved = localStorage.getItem(WORDS_KEY);
        if (!saved) return new Array(capacity).fill(null);
        try {
            const parsed = JSON.parse(saved);
            if (!Array.isArray(parsed)) return new Array(capacity).fill(null);

            // Resize gracefully if capacity ever changes
            const resized = new Array(capacity).fill(null);
            for (let i = 0; i < Math.min(parsed.length, capacity); i++) {
                resized[i] = parsed[i];
            }
            return resized;
        } catch (error) {
            console.error("Error reading saved words:", error);
            return new Array(capacity).fill(null);
        }
    }

    function saveGeneratedWords(words) {
        localStorage.setItem(WORDS_KEY, JSON.stringify(words));
    }

    let generatedWords = getGeneratedWords();

    /*
    =====================================================
    SAVE / LOAD SCROLL POSITION (CURRENT COLUMN)
    =====================================================
    */

    function getSavedColumn() {
        const saved = localStorage.getItem(POSITION_KEY);
        if (saved === null) return 0;

        const parsed = parseInt(saved, 10);
        if (isNaN(parsed)) return 0;

        if (parsed < 0) return 0;
        if (parsed > maxColumnOffset) return maxColumnOffset;
        return parsed;
    }

    function saveColumn(column) {
        localStorage.setItem(POSITION_KEY, String(column));
    }

    currentColumn = getSavedColumn();

    /*
    =====================================================
    GET WORD STATUS (COLOUR ONLY)
    =====================================================
    */

    function getWordStatus(word, clickedTimes) {

        if (!word || !clickedTimes[word]) return "normal";

        const clickedTime = clickedTimes[word];
        const currentTime = Date.now();
        const elapsedTime = currentTime - clickedTime;

        if (elapsedTime >= NINETY_SIX_HOURS) return "normal";
        if (elapsedTime < TWENTY_FOUR_HOURS) return "red";
        if (elapsedTime < FORTY_EIGHT_HOURS) return "orange";
        if (elapsedTime < SEVENTY_TWO_HOURS) return "yellow";
        return "light-yellow";
    }

    /*
    =====================================================
    DISPLAY WORD BUBBLES (FILLED + EMPTY)
    =====================================================
    */

    function showWords() {

        countryList.innerHTML = "";

        const startIndex = currentColumn * slotsPerColumn;
        const endIndex = startIndex + (slotsPerColumn * visibleColumns);
        const visibleSlots = generatedWords.slice(startIndex, endIndex);

        const clickedTimes = getClickedTimes();

        visibleSlots.forEach(word => {

            const button = document.createElement("button");
            button.className = "country-button";

            if (word) {
                button.innerText = word;
                button.dataset.word = word;

                const status = getWordStatus(word, clickedTimes);
                applyWordStatus(button, status);

                button.onclick = function() {
                    copyWord(button, word);
                };
            } else {
                button.innerText = "";
                button.classList.add("empty");
                button.disabled = true;
            }

            countryList.appendChild(button);
        });

        updateNavigationButtons();
        updateGenerateButton();
    }

    /*
    =====================================================
    APPLY WORD STATUS (COLOUR ONLY - NEVER DISABLES A FILLED BUBBLE)
    =====================================================
    */

    function applyWordStatus(button, status) {

        button.classList.remove(
            "status-red",
            "status-orange",
            "status-yellow",
            "status-light-yellow"
        );

        if (status === "red") {
            button.classList.add("status-red");
        } else if (status === "orange") {
            button.classList.add("status-orange");
        } else if (status === "yellow") {
            button.classList.add("status-yellow");
        } else if (status === "light-yellow") {
            button.classList.add("status-light-yellow");
        }

        button.disabled = false;
    }

    /*
    =====================================================
    GENERATE WORD
    - New word always lands in the first bubble.
    - Everything else shifts down one slot (down the column,
      then into the next column), and whatever falls off the
      end of the 120th slot is dropped.
    - Never repeats a word already sitting in a bubble.
    =====================================================
    */

    function generateWord() {

        const usedWords = new Set(generatedWords.filter(w => w !== null));

        let newWord;
        let attempts = 0;
        do {
            newWord = randomFrom(englishWords);
            attempts++;
        } while (
            (usedWords.has(newWord) || containsBannedSubstring(newWord)) &&
            attempts < 50
        );

        if (usedWords.has(newWord) || containsBannedSubstring(newWord)) {
            window.alert("Couldn't come up with a suitable word - try again.");
            return;
        }

        // New word always goes in the very first bubble.
        // Everything else shifts down one slot; whatever falls
        // off the end (120th slot) is dropped.
        generatedWords.unshift(newWord);
        generatedWords.pop();
        saveGeneratedWords(generatedWords);

        // Jump the view back to the first page so the new word is visible
        currentColumn = 0;
        saveColumn(currentColumn);

        showWords();
    }

    /*
    =====================================================
    MOVE LEFT / RIGHT
    =====================================================
    */

    function moveLeft() {
        if (currentColumn > 0) {
            currentColumn--;
            saveColumn(currentColumn);
            showWords();
        }
    }

    function moveRight() {
        if (currentColumn < maxColumnOffset) {
            currentColumn++;
            saveColumn(currentColumn);
            showWords();
        }
    }

    /*
    =====================================================
    UPDATE NAVIGATION / GENERATE BUTTON STATE
    =====================================================
    */

    function updateNavigationButtons() {
        leftButton.disabled = currentColumn === 0;
        rightButton.disabled = currentColumn >= maxColumnOffset;
    }

    function updateGenerateButton() {
        // Always enabled - new words always shift into the first
        // bubble, so there's no "full" state to block on.
        generateButton.disabled = false;
    }

    /*
    =====================================================
    COPY WORD
    =====================================================
    */

    function copyTextFallback(text) {
        try {
            const textarea = document.createElement("textarea");
            textarea.value = text;
            textarea.style.position = "fixed";
            textarea.style.top = "0";
            textarea.style.left = "0";
            textarea.style.opacity = "0";
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            const success = document.execCommand("copy");
            document.body.removeChild(textarea);
            return success;
        } catch (error) {
            console.error("Fallback copy failed:", error);
            return false;
        }
    }

    function copyWord(button, word) {

        const clickedTimes = getClickedTimes();
        clickedTimes[word] = Date.now();
        saveClickedTimes(clickedTimes);

        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(word).catch(() => {
                copyTextFallback(word);
            });
        } else {
            copyTextFallback(word);
        }

        button.innerText = "Copied!";
        button.classList.remove(
            "status-orange",
            "status-yellow",
            "status-light-yellow"
        );
        button.classList.add("status-red");

        setTimeout(function() {
            button.innerText = word;
        }, 1000);
    }

    /*
    =====================================================
    CLEAR DATA
    RESETS COLOUR GRADING ONLY - WORDS STAY IN PLACE
    =====================================================
    */

    function clearData() {

        const confirmed = window.confirm(
            "Clear colour data? This will reset every bubble's colour back to normal (words stay put)."
        );

        if (!confirmed) {
            return;
        }

        localStorage.removeItem(STORAGE_KEY);

        showWords();
    }

    /*
    =====================================================
    CLEAR WORDS
    EMPTIES ALL 120 BUBBLES (WORDS ONLY - COLOURS UNTOUCHED)
    =====================================================
    */

    function clearWords() {

        const confirmed = window.confirm(
            "Clear all generated words? This will empty every bubble."
        );

        if (!confirmed) {
            return;
        }

        localStorage.removeItem(WORDS_KEY);
        generatedWords = new Array(capacity).fill(null);

        showWords();
    }

    /*
    =====================================================
    AUTOMATICALLY UPDATE COLOURS
    =====================================================
    */

    function updateAllWordStatuses() {

        const clickedTimes = getClickedTimes();
        const buttons = document.querySelectorAll(".country-button:not(.empty)");

        buttons.forEach(button => {
            const word = button.dataset.word;
            if (!word || button.innerText === "Copied!") return;

            const status = getWordStatus(word, clickedTimes);
            applyWordStatus(button, status);
        });
    }

    /*
    =====================================================
    START
    =====================================================
    */

    showWords();

    setInterval(updateAllWordStatuses, 60 * 1000);

</script>
</body>
</html>
