<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phrase Generator</title>
<style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: Arial, sans-serif; }
    body { background: #f5f5f5; display: flex; justify-content: center; align-items: center; }
    .app { width: 100%; max-width: 900px; height: 100dvh; padding: 12px; display: flex; flex-direction: column; overflow: hidden; }
    .header { flex: 0 0 96px; display: flex; flex-direction: column; justify-content: center; gap: 8px; overflow: hidden; }
    .header-top, .header-bottom { display: flex; align-items: center; justify-content: center; gap: 10px; }
    h1 { margin: 0; font-size: 18px; text-align: center; white-space: nowrap; }

    button { font-family: inherit; }
    .generate-button { height: 40px; border: none; border-radius: 8px; background: #51cf66; color: #fff; box-shadow: 0 2px 5px rgba(0,0,0,.15); font-size: 15px; font-weight: bold; padding: 0 20px; cursor: pointer; transition: .15s; }
    .generate-button:active { transform: scale(.92); }
    .clear-button, .clear-words-button { height: 38px; border: none; border-radius: 8px; color: #fff; box-shadow: 0 2px 5px rgba(0,0,0,.15); font-size: 13px; font-weight: bold; padding: 0 12px; cursor: pointer; transition: .15s; white-space: nowrap; }
    .clear-button { background: #ff6b6b; }
    .clear-words-button { background: #495057; }
    .clear-button:active, .clear-words-button:active { transform: scale(.92); }

    /* newest phrase on the left, 9 older ones on the right (10 total) */
    .country-list { flex: 1; min-height: 0; width: 100%; display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(9, 1fr); grid-auto-flow: column; gap: 6px; overflow: hidden; }
    .country-button { width: 100%; height: 100%; min-width: 0; min-height: 0; border: none; border-radius: 8px; background: white; box-shadow: 0 2px 5px rgba(0,0,0,.15); font-size: 12px; font-weight: bold; cursor: pointer; padding: 4px 6px; overflow: hidden; transition: .15s; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; }
    .country-button .word-text { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; white-space: normal; word-break: break-word; text-align: center; }
    .country-button .word-flag { font-size: 10px; opacity: .7; font-weight: normal; margin-top: 2px; }
    .country-button:active { transform: scale(.97); }
    .country-button.single-slot { grid-row: span 9; font-size: 20px; padding: 14px; }
    .country-button.single-slot .word-text { -webkit-line-clamp: 12; }
    .country-button.single-slot .word-flag { font-size: 13px; margin-top: 8px; }
    .country-button.empty { background: rgba(255,255,255,.4); box-shadow: none; border: 1px dashed rgba(0,0,0,.15); cursor: default; }

    .country-button.status-red { background: #ff6b6b; color: #000; }
    .country-button.status-orange { background: #ffa94d; color: #000; }
    .country-button.status-yellow { background: #ffe066; color: #000; }
    .country-button.status-light-yellow { background: #fff3bf; color: #000; }
</style>
</head>
<body>

<div class="app">
    <div class="header">
        <div class="header-top">
            <h1>Phrase Generator</h1>
            <button id="generateButton" class="generate-button" onclick="generateWord()">Generate</button>
        </div>
        <div class="header-bottom">
            <button class="clear-button" onclick="clearData()">Clear Colours</button>
            <button class="clear-words-button" onclick="clearWords()">Clear Phrases</button>
        </div>
    </div>
    <div id="countryList" class="country-list"></div>
</div>

<script>
    /*
    BASE PHRASES - things real people type into a search box or chat.
    Each one gets damaged by the mutation engine below before it is shown.
    */
    const wordBank = {
        en: { flag: "EN", words: [
            "how do i reset my password","what is the best way to learn guitar","why is my phone battery draining so fast",
            "can you recommend a good book to read","how long does it take to boil an egg","where can i buy cheap flights to bali",
            "what should i cook for dinner tonight","how to lose weight without going to the gym","is it safe to eat leftover rice",
            "how do i get rid of a headache fast","best restaurants near me open now","how to write a cover letter for a job",
            "why does my dog keep scratching his ears","what time does the pharmacy close","how do i convert a pdf to word",
            "how much water should i drink a day","how to fix a leaking kitchen tap","what is the difference between a virus and bacteria",
            "can i travel with an expired passport","how to make my wifi signal stronger","what to do when you cant sleep at night",
            "how do i change my email address on instagram","who won the football match last night","how to start a small business from home",
            "is it normal to feel tired all the time","what is the weather like tomorrow","how do i learn to code for free",
            "how to remove a stain from a white shirt","how many calories are in a banana","what is a good gift for my mother",
            "how do i book a doctor appointment online","why is my laptop running so slow","how to say thank you in japanese",
            "can you help me write a birthday message","how to grow tomatoes on a balcony","what are the symptoms of a cold",
            "how do i cancel my subscription","how to meditate for beginners","where is the nearest atm","how to tie a tie step by step"
        ]},
        zh: { flag: "ZH", words: [
            "怎么重置我的密码","学吉他最好的方法是什么","为什么我的手机电池掉得这么快","哪里可以买到便宜的机票","今晚晚饭做什么好呢",
            "不去健身房怎么减肥","煮一个鸡蛋需要多长时间","药店几点关门","怎么把pdf转换成word","每天应该喝多少水",
            "厨房水龙头漏水怎么修","晚上睡不着觉怎么办","怎么写求职信","昨晚的足球比赛谁赢了","在家创业要怎么开始",
            "总是觉得很累正常吗","白衬衫上的污渍怎么去除","送妈妈什么礼物比较好","怎么在网上预约医生","为什么我的电脑这么卡",
            "怎么取消订阅","最近的取款机在哪里","怎么免费学编程","感冒有哪些症状","阳台上怎么种番茄","附近有什么好吃的餐厅"
        ]}
    };
    // mostly English, Chinese only now and then (0.15 = about 1 in 7)
    const CHINESE_CHANCE = 0.15;

    function randomFrom(list) { return list[Math.floor(Math.random() * list.length)]; }
    function randInt(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }

    /*
    MUTATIONS - make the phrase look like something a real person
    left unfinished or typed too fast.
    */
    const keyNeighbours = {
        a:"sq",b:"vn",c:"xv",d:"sf",e:"wr",f:"dg",g:"fh",h:"gj",i:"uo",j:"hk",k:"jl",l:"k",m:"n",
        n:"bm",o:"ip",p:"o",q:"w",r:"et",s:"ad",t:"ry",u:"yi",v:"cb",w:"qe",x:"zc",y:"tu",z:"x"
    };

    function pickWordIndex(words, minLen) {
        const ok = words.map((w, i) => w.length >= minLen ? i : -1).filter(i => i >= 0);
        return ok.length ? randomFrom(ok) : -1;
    }

    const latinMutations = {
        dropWord(text) {
            const w = text.split(" ");
            if (w.length < 4) return null;
            w.splice(randInt(1, w.length - 1), 1);
            return w.join(" ");
        },
        dropLetter(text) {
            const w = text.split(" "), i = pickWordIndex(w, 4);
            if (i < 0) return null;
            const p = randInt(1, w[i].length - 1);
            w[i] = w[i].slice(0, p) + w[i].slice(p + 1);
            return w.join(" ");
        },
        swapLetters(text) {
            const w = text.split(" "), i = pickWordIndex(w, 4);
            if (i < 0) return null;
            const p = randInt(0, w[i].length - 2), c = w[i].split("");
            [c[p], c[p + 1]] = [c[p + 1], c[p]];
            w[i] = c.join("");
            return w.join(" ");
        },
        doubleLetter(text) {
            const w = text.split(" "), i = pickWordIndex(w, 3);
            if (i < 0) return null;
            const p = randInt(0, w[i].length - 1);
            w[i] = w[i].slice(0, p) + w[i][p] + w[i].slice(p);
            return w.join(" ");
        },
        wrongKey(text) {
            const w = text.split(" "), i = pickWordIndex(w, 3);
            if (i < 0) return null;
            const p = randInt(0, w[i].length - 1), ch = w[i][p].toLowerCase();
            if (!keyNeighbours[ch]) return null;
            w[i] = w[i].slice(0, p) + randomFrom(keyNeighbours[ch].split("")) + w[i].slice(p + 1);
            return w.join(" ");
        },
        cutOff(text) {
            // incomplete - stops mid-way, sometimes mid-word
            if (text.length < 14) return null;
            return text.slice(0, randInt(Math.ceil(text.length * 0.5), text.length - 3)).trimEnd();
        },
        cutWords(text) {
            const w = text.split(" ");
            if (w.length < 4) return null;
            return w.slice(0, randInt(Math.ceil(w.length / 2), w.length - 1)).join(" ");
        }
    };

    const chineseMutations = {
        dropChar(text) {
            const c = Array.from(text);
            if (c.length < 6) return null;
            c.splice(randInt(1, c.length - 2), 1);
            return c.join("");
        },
        swapChars(text) {
            const c = Array.from(text);
            if (c.length < 6) return null;
            const p = randInt(0, c.length - 2);
            [c[p], c[p + 1]] = [c[p + 1], c[p]];
            return c.join("");
        },
        cutOff(text) {
            const c = Array.from(text);
            if (c.length < 6) return null;
            return c.slice(0, randInt(Math.ceil(c.length * 0.5), c.length - 1)).join("");
        }
    };

    function mutatePhrase(text, lang) {
        const set = lang === "zh" ? chineseMutations : latinMutations;
        const names = Object.keys(set);
        let result = text;
        const passes = Math.random() < 0.35 ? 2 : 1;
        const used = new Set();

        for (let n = 0; n < passes; n++) {
            for (let tries = 0; tries < 8; tries++) {
                const name = randomFrom(names);
                if (used.has(name)) continue;
                const out = set[name](result);
                if (out && out !== result) { result = out; used.add(name); break; }
            }
        }

        if (lang !== "zh") {
            // real users are inconsistent with caps and question marks
            const cut = used.has("cutOff") || used.has("cutWords");
            if (!cut && Math.random() < 0.3) result += "?";
            if (Math.random() < 0.2) result = result.charAt(0).toUpperCase() + result.slice(1);
        }
        return result;
    }

    /*
    CONTENT FILTER
    */
    const bannedSubstrings = [
        "sex","porn","fuck","fuk","fck","shit","cunt","cock","dick","penis","vagina","boob","tit","nude",
        "naked","rape","slut","whore","bitch","biatch","hoe","xxx","anal","orgasm","cum","jizz","clit",
        "smut","erotic","fetish","incest","milf","nsfw"
    ];
    function containsBannedSubstring(text) {
        const lower = text.toLowerCase();
        return bannedSubstrings.some(sub => lower.includes(sub));
    }

    /*
    SETTINGS - history is capped at 10: slot 0 = newest (tall), slots 1-9 = older
    */
    const capacity = 10;
    const countryList = document.getElementById("countryList");

    /*
    TIME SETTINGS
    */
    const ONE_HOUR = 60 * 60 * 1000;
    const RED_END = 4 * ONE_HOUR;
    const ORANGE_END = RED_END + 24 * ONE_HOUR;
    const YELLOW_END = ORANGE_END + 24 * ONE_HOUR;
    const LIGHT_YELLOW_END = YELLOW_END + 24 * ONE_HOUR;

    /*
    STORAGE (new keys so old single-word data doesn't mix in)
    */
    const STORAGE_KEY = "phraseGenClickedTimes";
    const WORDS_KEY = "phraseGenGenerated";
    const LANGS_KEY = "phraseGenLangs";

    function safeGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
    function safeSet(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }
    function safeRemove(key) { try { localStorage.removeItem(key); } catch (e) {} }

    function getClickedTimes() {
        const s = safeGet(STORAGE_KEY);
        if (!s) return {};
        try { return JSON.parse(s) || {}; } catch (e) { return {}; }
    }
    function saveClickedTimes(t) { safeSet(STORAGE_KEY, JSON.stringify(t)); }

    function loadSlots(key) {
        const out = new Array(capacity).fill(null);
        const s = safeGet(key);
        if (!s) return out;
        try {
            const parsed = JSON.parse(s);
            if (Array.isArray(parsed)) for (let i = 0; i < Math.min(parsed.length, capacity); i++) out[i] = parsed[i];
        } catch (e) {}
        return out;
    }

    let generatedWords = loadSlots(WORDS_KEY);
    let generatedLangs = loadSlots(LANGS_KEY);


    function getWordStatus(word, clickedTimes) {
        if (!word || !clickedTimes[word]) return "normal";
        const elapsed = Date.now() - clickedTimes[word];
        if (elapsed >= LIGHT_YELLOW_END) return "normal";
        if (elapsed < RED_END) return "red";
        if (elapsed < ORANGE_END) return "orange";
        if (elapsed < YELLOW_END) return "yellow";
        return "light-yellow";
    }

    function applyWordStatus(button, status) {
        button.classList.remove("status-red", "status-orange", "status-yellow", "status-light-yellow");
        if (status !== "normal") button.classList.add("status-" + status);
        button.disabled = false;
    }

    /*
    DISPLAY
    */
    function showWords() {
        countryList.innerHTML = "";
        const clickedTimes = getClickedTimes();
        const cells = [];
        for (let i = 0; i < capacity; i++) cells.push({ index: i, single: i === 0 });

        cells.forEach(cell => {
            const word = generatedWords[cell.index];
            const lang = generatedLangs[cell.index];
            const button = document.createElement("button");
            button.className = "country-button";
            if (cell.single) button.classList.add("single-slot");

            if (word) {
                const wordSpan = document.createElement("span");
                wordSpan.className = "word-text";
                wordSpan.innerText = word;
                button.appendChild(wordSpan);

                button.dataset.word = word;
                applyWordStatus(button, getWordStatus(word, clickedTimes));
                button.onclick = function () { copyWord(button, word, wordSpan); };
            } else {
                button.classList.add("empty");
                button.disabled = true;
            }
            countryList.appendChild(button);
        });
    }

    /*
    GENERATE - random language, random base phrase, then mutate it.
    New phrase goes in the tall slot; everything else shifts down.
    */
    function generateWord() {
        const used = new Set(generatedWords.filter(w => w !== null));
        let newWord = null, newLang = null;

        for (let attempts = 0; attempts < 50; attempts++) {
            const lang = Math.random() < CHINESE_CHANCE ? "zh" : "en";
            const base = randomFrom(wordBank[lang].words);
            const candidate = mutatePhrase(base, lang);
            if (!used.has(candidate) && !containsBannedSubstring(candidate)) {
                newWord = candidate;
                newLang = lang;
                break;
            }
        }

        if (!newWord) { window.alert("Couldn't come up with a suitable phrase - try again."); return; }

        generatedWords.unshift(newWord); generatedWords.pop();
        generatedLangs.unshift(newLang); generatedLangs.pop();
        safeSet(WORDS_KEY, JSON.stringify(generatedWords));
        safeSet(LANGS_KEY, JSON.stringify(generatedLangs));

        showWords();
    }

    /*
    COPY
    */
    function copyTextFallback(text) {
        try {
            const ta = document.createElement("textarea");
            ta.value = text;
            ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
            document.body.appendChild(ta);
            ta.focus(); ta.select();
            const ok = document.execCommand("copy");
            document.body.removeChild(ta);
            return ok;
        } catch (e) { return false; }
    }

    function copyWord(button, word, wordSpan) {
        const times = getClickedTimes();
        times[word] = Date.now();
        saveClickedTimes(times);

        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(word).catch(() => copyTextFallback(word));
        } else {
            copyTextFallback(word);
        }

        const original = wordSpan.innerText;
        wordSpan.innerText = "Copied!";
        applyWordStatus(button, "red");
        setTimeout(() => { wordSpan.innerText = original; }, 1000);
    }

    /*
    CLEAR
    */
    function clearData() {
        if (!window.confirm("Clear colour data? Every bubble's colour goes back to normal (phrases stay put).")) return;
        safeRemove(STORAGE_KEY);
        showWords();
    }

    function clearWords() {
        if (!window.confirm("Clear all generated phrases? This will empty every bubble.")) return;
        safeRemove(WORDS_KEY);
        safeRemove(LANGS_KEY);
        generatedWords = new Array(capacity).fill(null);
        generatedLangs = new Array(capacity).fill(null);
        showWords();
    }

    function updateAllWordStatuses() {
        const times = getClickedTimes();
        document.querySelectorAll(".country-button:not(.empty)").forEach(button => {
            const word = button.dataset.word;
            const span = button.querySelector(".word-text");
            if (!word || (span && span.innerText === "Copied!")) return;
            applyWordStatus(button, getWordStatus(word, times));
        });
    }

    showWords();
    setInterval(updateAllWordStatuses, 60 * 1000);
</script>
</body>
</html>
